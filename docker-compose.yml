services:

  database:
    build:
      context: .
      dockerfile: development/database.Dockerfile
    volumes:
      - suuq-data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/suuq.db"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../development/backend.Dockerfile
    environment:
      DB_PATH: /data/suuq.db
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET to a random secret of at least 32 bytes}
    volumes:
      - suuq-data:/data
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: .
      dockerfile: development/frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  suuq-data:
