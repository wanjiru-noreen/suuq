<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account — SUUQ</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div
      id="app"
      style="justify-content: center; align-items: center; padding: 1.5rem"
    >
      <div style="width: 100%; max-width: 400px">
        <div style="text-align: center; margin-bottom: 2rem">
          <div
            class="brand-title"
            style="
              justify-content: center;
              font-size: 1.75rem;
              margin-bottom: 0.5rem;
            "
          >
            <span class="brand-badge" style="width: 10px; height: 10px"></span>
            SUUQ
          </div>
          <h1
            style="
              font-size: 1.25rem;
              font-weight: 700;
              color: var(--text-primary);
            "
          >
            Create Account
          </h1>
        </div>

        <div class="card">
          <form id="register-form">
            <div class="form-group">
              <label class="form-label" for="name">Full Name</label>
              <input
                type="text"
                id="name"
                class="form-control"
                placeholder="Noreen Wanjiru"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="email">Email Address</label>
              <input
                type="email"
                id="email"
                class="form-control"
                placeholder="noreen@example.com"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="password">Password</label>
              <input
                type="password"
                id="password"
                class="form-control"
                placeholder="••••••••"
                required
                minlength="6"
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="confirm-password"
                >Confirm Password</label
              >
              <input
                type="password"
                id="confirm-password"
                class="form-control"
                placeholder="••••••••"
                required
                minlength="6"
              />
            </div>

            <div
              id="error-message"
              style="
                color: var(--status-critical);
                font-size: 0.85rem;
                margin-bottom: 1rem;
                display: none;
              "
            ></div>

            <button
              type="submit"
              class="btn btn-primary"
              style="margin-top: 0.5rem"
            >
              Create Account
            </button>
          </form>
        </div>

        <div
          style="
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
          "
        >
          Already have an account?
          <a
            href="login.html"
            style="color: var(--accent-emerald); font-weight: 600"
            >Login</a
          >
        </div>
      </div>
    </div>

    <script type="module">
      import { auth } from "./js/auth.js";

      document
        .getElementById("register-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const name = document.getElementById("name").value;
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const confirmPassword =
            document.getElementById("confirm-password").value;
          const errorDiv = document.getElementById("error-message");

          errorDiv.style.display = "none";

          if (password !== confirmPassword) {
            errorDiv.textContent = "Passwords do not match";
            errorDiv.style.display = "block";
            return;
          }

          try {
            await auth.register(name, email, password);
          } catch (err) {
            errorDiv.textContent =
              err.message || "Registration failed. Please try again.";
            errorDiv.style.display = "block";
          }
        });
    </script>
  </body>
</html>
