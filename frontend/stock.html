<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock — SUUQ</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="top-header">
        <div class="brand-title">
          <span class="brand-badge"></span>
          SUUQ
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="notif-btn" aria-label="Notifications">
            🔔
          </button>
          <button
            class="icon-btn"
            id="profile-btn"
            aria-label="Account Profile"
          >
            👤
          </button>
        </div>
      </header>

      <main class="main-content">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
          "
        >
          <div>
            <h1 style="font-size: 1.25rem; font-weight: 700">
              Stock & Inventory
            </h1>
            <p style="color: var(--text-secondary); font-size: 0.85rem">
              Monitor quantities and adjustments
            </p>
          </div>
          <button
            class="btn btn-primary"
            id="open-restock-modal"
            style="
              min-height: 40px;
              padding: 0 1rem;
              font-size: 0.85rem;
              width: auto;
            "
          >
            + Update Stock
          </button>
        </div>

        <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem">
          <input
            type="text"
            id="stock-search-input"
            class="form-control"
            placeholder="Search stock items..."
            style="min-height: 42px"
          />
        </div>

        <div
          id="stock-list"
          style="display: flex; flex-direction: column; gap: 0.75rem"
        >
          <div
            style="
              color: var(--text-muted);
              font-size: 0.85rem;
              text-align: center;
              padding: 2rem 0;
            "
          >
            Loading stock levels...
          </div>
        </div>
      </main>

      <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
          <span>🏠</span>
          <span>Dash</span>
        </a>
        <a href="products.html" class="nav-item">
          <span>📦</span>
          <span>Products</span>
        </a>
        <a href="stock.html" class="nav-item active">
          <span>📊</span>
          <span>Stock</span>
        </a>
        <a href="debtors.html" class="nav-item">
          <span>👥</span>
          <span>Debtors</span>
        </a>
        <button class="nav-item" id="more-menu-btn">
          <span>☰</span>
          <span>More</span>
        </button>
      </nav>

      <div class="modal-overlay" id="restock-modal">
        <div class="modal-sheet">
          <div class="sheet-handle"></div>
          <div style="font-weight: 700; margin-bottom: 1rem; font-size: 1.1rem">
            Update Stock Level
          </div>

          <form id="restock-form">
            <div class="form-group">
              <label class="form-label" for="restock-product"
                >Select Product</label
              >
              <select id="restock-product" class="form-control" required>
                <option value="">-- Choose product --</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="restock-qty">New Quantity</label>
              <input
                type="number"
                id="restock-qty"
                class="form-control font-mono"
                placeholder="0"
                min="0"
                required
              />
            </div>

            <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem">
              <button
                type="button"
                class="btn btn-secondary"
                id="close-restock-modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-primary">
                Update Quantity
              </button>
            </div>
          </form>
        </div>
      </div>

      <div class="modal-overlay" id="more-modal">
        <div class="modal-sheet">
          <div class="sheet-handle"></div>
          <div
            style="
              font-weight: 700;
              margin-bottom: 1rem;
              color: var(--text-secondary);
              font-size: 0.8rem;
              letter-spacing: 0.05em;
            "
          >
            QUICK MENU
          </div>
          <div style="display: flex; flex-direction: column; gap: 0.5rem">
            <a
              href="creditors.html"
              class="btn btn-secondary"
              style="justify-content: flex-start; gap: 0.75rem"
              >🏢 Creditors</a
            >
            <a
              href="reports.html"
              class="btn btn-secondary"
              style="justify-content: flex-start; gap: 0.75rem"
              >📈 Reports</a
            >
            <a
              href="ai.html"
              class="btn btn-secondary"
              style="justify-content: flex-start; gap: 0.75rem"
              >🤖 AI Analysis</a
            >
            <button
              id="logout-btn"
              class="btn btn-secondary"
              style="
                justify-content: flex-start;
                gap: 0.75rem;
                color: var(--status-critical);
              "
            >
              🚪 Logout
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="js/stock.js"></script>
  </body>
</html>
