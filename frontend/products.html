<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — SUUQ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="top-header">
      <div class="brand-title">
        <span class="brand-badge"></span>
        SUUQ
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="notif-btn" aria-label="Notifications">🔔</button>
        <button class="icon-btn" id="profile-btn" aria-label="Account Profile">👤</button>
      </div>
    </header>

    <main class="main-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
        <div>
          <h1 style="font-size: 1.25rem; font-weight: 700;">Products Directory</h1>
          <p style="color: var(--text-secondary); font-size: 0.85rem;">Manage catalog items and categories</p>
        </div>
        <button class="btn btn-primary" id="open-add-modal" style="min-height: 40px; padding: 0 1rem; font-size: 0.85rem; width: auto;">+ Add Product</button>
      </div>

      <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
        <input type="text" id="search-input" class="form-control" placeholder="Search products..." style="min-height: 42px;">
      </div>

      <div id="products-list" style="display: flex; flex-direction: column; gap: 0.75rem;">
        <div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 2rem 0;">Loading products...</div>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="dashboard.html" class="nav-item">
        <span>🏠</span>
        <span>Dash</span>
      </a>
      <a href="products.html" class="nav-item active">
        <span>📦</span>
        <span>Products</span>
      </a>
      <a href="stock.html" class="nav-item">
        <span>📊</span>
        <span>Stock</span>
      </a>
      <a href="debtors.html" class="nav-item">
        <span>👥</span>
        <span>Debtors</span>
      </a>
      <button class="nav-item" id="more-menu-btn">
        <span>☰</span>
        <span>More</span>
      </button>
    </nav>

    <div class="modal-overlay" id="product-modal">
      <div class="modal-sheet">
        <div class="sheet-handle"></div>
        <div style="font-weight: 700; margin-bottom: 1rem; font-size: 1.1rem;" id="modal-title">Add Product</div>
        
        <form id="product-form">
          <div class="form-group">
            <label class="form-label" for="prod-name">Product Name</label>
            <input type="text" id="prod-name" class="form-control" placeholder="e.g. Premium Sugar 1kg" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="prod-category">Category</label>
            <input type="text" id="prod-category" class="form-control" placeholder="e.g. Provisions" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="prod-desc">Description</label>
            <input type="text" id="prod-desc" class="form-control" placeholder="Optional details">
          </div>

          <div class="form-group">
            <label class="form-label" for="prod-qty">Initial Quantity</label>
            <input type="number" id="prod-qty" class="form-control font-mono" placeholder="0" min="0" required>
          </div>

          <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
            <button type="button" class="btn btn-secondary" id="close-modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Product</button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal-overlay" id="more-modal">
      <div class="modal-sheet">
        <div class="sheet-handle"></div>
        <div style="font-weight: 700; margin-bottom: 1rem; color: var(--text-secondary); font-size: 0.8rem; letter-spacing: 0.05em;">QUICK MENU</div>
        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
          <a href="creditors.html" class="btn btn-secondary" style="justify-content: flex-start; gap: 0.75rem;">🏢 Creditors</a>
          <a href="reports.html" class="btn btn-secondary" style="justify-content: flex-start; gap: 0.75rem;">📈 Reports</a>
          <a href="ai.html" class="btn btn-secondary" style="justify-content: flex-start; gap: 0.75rem;">🤖 AI Analysis</a>
          <button id="logout-btn" class="btn btn-secondary" style="justify-content: flex-start; gap: 0.75rem; color: var(--status-critical);">🚪 Logout</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/products.js"></script>
</body>
</html>
